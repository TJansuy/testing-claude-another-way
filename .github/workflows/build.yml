name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: castdeck-linux
          path: dist/*.tar.gz

      # Every push to a branch replaces a "Latest build" pre-release on the
      # Releases page, so there is always a download link for the newest code.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/*.tar.gz \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_REF_NAME})" \
            --notes "Automatic build of ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`. For a Steam Deck, download the \`linux-amd64\` archive."

      # Pushing a v* tag publishes a regular, versioned release.
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
